name: $(Build.DefinitionName)-$(date:yyyyMMdd)$(rev:.r)

variables:
    buildConfiguration: 'Release'
    dependencyTrackVersion: '17'
    # Whether this branch's major is released, so its uploads may become the latest version in Dependency-Track.
    dependencyTrackMarkAsLatest: true
#  VersionNumber: $(Major).$(Minor).$(rev:.r)
stages:
    - stage: Unit_Tests
      dependsOn: []
      displayName: Unit Tests
      jobs:
          - job: Windows_Unit_Tests
            displayName: Windows
            pool:
                vmImage: windows-latest
            steps:
                - task: UseDotNet@2
                  displayName: Use .Net 10.x
                  inputs:
                      version: 10.x

                - task: DotNetCoreCLI@2
                  displayName: 'dotnet restore'
                  inputs:
                      command: 'restore'
                      projects: '**/*.Tests.csproj'
                      restoreArguments: '--source https://www.myget.org/F/umbraconightly/api/v3/index.json --source https://www.myget.org/F/umbracoprereleases/api/v3/index.json --source https://api.nuget.org/v3/index.json'

                - task: DotNetCoreCLI@2
                  displayName: 'dotnet build'
                  inputs:
                      command: 'build'
                      projects: '**/*.Tests.csproj'
                      arguments: '--no-restore'

                - task: DotNetCoreCLI@2
                  displayName: 'dotnet test'
                  inputs:
                      command: test
                      projects: '**/*.Tests.csproj'
                      arguments: '--no-build'

          - job: Linux_Unit_test
            displayName: Linux
            pool:
                vmImage: ubuntu-latest
            steps:
                - task: UseDotNet@2
                  displayName: Use .Net Core 10.x
                  inputs:
                      version: 10.x

                - task: DotNetCoreCLI@2
                  displayName: 'dotnet restore'
                  inputs:
                      command: 'restore'
                      projects: '**/*.Tests.csproj'
                      restoreArguments: '--source https://www.myget.org/F/umbraconightly/api/v3/index.json --source https://www.myget.org/F/umbracoprereleases/api/v3/index.json --source https://api.nuget.org/v3/index.json'

                - task: DotNetCoreCLI@2
                  displayName: 'dotnet build'
                  inputs:
                      command: 'build'
                      projects: '**/*.Tests.csproj'
                      arguments: '--no-restore'

                - task: DotNetCoreCLI@2
                  displayName: 'dotnet test'
                  inputs:
                      command: test
                      projects: '**/*.Tests.csproj'
                      arguments: '--no-build'

    - stage: Dependency_Track_Nuget_Sbom
      displayName: 'Dependency Tracking'
      dependsOn: [Unit_Tests]
      jobs:
          - job: DependencyTrack
            displayName: Upload SBOM to DependencyTrack
            pool:
                vmImage: windows-latest
            steps:
            - checkout: self
              fetchDepth: 0

            - task: UseDotNet@2
              displayName: Use .Net Core 10.x
              inputs:
                  version: 10.x

            - script: dotnet restore src/UmbracoExamine.PDF.sln
              displayName: 'Restore NuGet packages'

            - pwsh: |
                  dotnet tool install --tool-path "$(Agent.TempDirectory)/umbraco-sbom" Umbraco.Internal.Sbom
                  & "$(Agent.TempDirectory)/umbraco-sbom/umbraco-sbom" src/UmbracoExamine.PDF.sln --output-file "$(Build.SourcesDirectory)/bom.xml"
                  # Exit code 10 means the SBOM was written, with warnings for unresolved licenses.
                  if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 10) { exit $LASTEXITCODE }
                  exit 0
              displayName: 'Generate NuGet SBOM'

            - publish: bom.xml
              artifact: sbom
              displayName: 'Publish NuGet SBOM Artifact'

            - pwsh: |
                  function Test-IsLatest([string] $name, [string] $version) {
                      try {
                          $versions = Invoke-RestMethod -Uri "$($env:DT_URL.TrimEnd('/'))/api/v1/project?name=$([uri]::EscapeDataString($name))&pageSize=1000" -Headers @{ 'X-Api-Key' = $env:DT_KEY }
                      } catch {
                          Write-Host "##vso[task.logissue type=warning]Could not read the versions of '$name' from Dependency-Track, so it is not marked as latest: $_"
                          return $false
                      }
                      $latest = @($versions | Where-Object { $_.isLatest })[0]
                      $latestMajor = 0
                      $isLatest = -not ($latest -and [int]::TryParse($latest.version.Split('.')[0], [ref] $latestMajor) -and $latestMajor -gt [int] $version.Split('.')[0])
                      Write-Host "Latest version of '$name' in Dependency-Track: $(if ($latest) { $latest.version } else { 'none' }). Mark $version as latest: $isLatest"
                      return $isLatest
                  }

                  $isLatest = '$(dependencyTrackMarkAsLatest)' -eq 'true' -and (Test-IsLatest 'Umbraco.ExaminePDF' '$(dependencyTrackVersion)')
                  Write-Host "##vso[task.setvariable variable=isLatest]$($isLatest.ToString().ToLower())"
              displayName: 'Determine whether to mark as latest'
              env:
                  DT_URL: $(DT_API_URL)
                  DT_KEY: $(DT_API_KEY)

            - task: upload-bom-dtrack@1
              displayName: 'Upload SBOM to Dependency-Track'
              inputs:
                bomFilePath: bom.xml
                dtrackProjName: 'Umbraco.ExaminePDF'
                dtrackProjVersion: $(dependencyTrackVersion)
                dtrackProjClassifier: APPLICATION
                dtrackIsLatest: $(isLatest)
                dtrackAPIKey: $(DT_API_KEY)
                dtrackURI: $(DT_API_URL)
                dtrackProjAutoCreate: true

    - stage: Nuget_Package
      displayName: 'Nuget'
      dependsOn: [Unit_Tests]
      jobs:
          - job: CreateNugetPackages
            displayName: 'Create package'
            pool:
                vmImage: 'windows-latest'
            steps:

                - task: UseDotNet@2
                  displayName: Use .Net Core 10.x
                  inputs:
                      version: 10.x

                - task: DotNetCoreCLI@2
                  displayName: 'dotnet restore'
                  inputs:
                      command: 'restore'
                      projects: '**/UmbracoExamine.PDF.csproj'
                      restoreArguments: '--source https://www.myget.org/F/umbraconightly/api/v3/index.json --source https://www.myget.org/F/umbracoprereleases/api/v3/index.json --source https://api.nuget.org/v3/index.json'

                - task: DotNetCoreCLI@2
                  displayName: 'dotnet build'
                  inputs:
                      command: 'build'
                      projects: '**/UmbracoExamine.PDF.csproj'
                      arguments: '--configuration $(buildConfiguration) --no-restore'

                - task: PowerShell@1
                  displayName: 'dotnet pack'
                  inputs:
                      scriptType: inlineScript
                      inlineScript: >
                          $isRelease = [regex]::matches($env:BUILD_SOURCEBRANCH,"v\d+\/\d+.\d+.*");

                          if ($isRelease.Count -gt 0)
                          {
                             Write-Host "##vso[build.addbuildtag]Release build"
                             dotnet pack --no-build --include-symbols --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) ./src/UmbracoExamine.PDF/UmbracoExamine.PDF.csproj
                          }
                          else
                          {
                             Write-Host "##vso[build.addbuildtag]Continuous build"
                             dotnet pack --no-build --include-symbols --version-suffix nightly.$(Build.BuildId) --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) ./src/UmbracoExamine.PDF/UmbracoExamine.PDF.csproj
                          }
                - task: PublishBuildArtifacts@1
                  displayName: 'Make NuGet Artifacts available for release'
                  inputs:
                      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
                      ArtifactName: packages
